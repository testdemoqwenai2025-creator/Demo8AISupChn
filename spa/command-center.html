<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Supply Chain Command Center | Enterprise Platform</title>
  <meta name="description" content="Global supply chain operations, tender management & AI automation hub. Real-time risk intelligence, compliance monitoring, and procurement optimization.">
  <meta http-equiv="refresh" content="0; url=/Demo8AISupChn/cc-app/">
  <link rel="icon" href="https://z-cdn.chatglm.cn/z-ai/static/logo.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader {
      text-align: center;
    }
    .loader-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .loader p {
      font-size: 0.875rem;
      color: #94a3b8;
    }
    .loader a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 32px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .loader a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="loader-icon"></div>
    <h1>AI Supply Chain Command Center</h1>
    <p>Loading exceptional command-center with all features...</p>
    <a href="/Demo8AISupChn/cc-app/">Enter Command Center</a>
  </div>
  <script>
    // Immediate redirect to the working command-center
    window.location.replace('/Demo8AISupChn/cc-app/');
  </script>
</body>
</html>
